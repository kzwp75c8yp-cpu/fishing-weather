name: 공개판 자료 갱신 (예보·바다낚시지수)
on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 (한국 시각)
    - cron: '30 8 * * *'    # 매일 17:30 (한국 시각)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_data.py
        env:
          DATAGO_KEY: ${{ secrets.DATAGO_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "공개판 자료 갱신" && git push)
