<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낚시 날씨</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
  /* 화면 틀은 다이빙 날씨 앱과 같음(어두운 전체 지도 · 오른쪽 계획 패널 · 하단 시간 바) */
  :root{
    --bg:#0e1116; --panel:rgba(20,24,31,.96); --panel-solid:#14181f; --line:#2a313c; --card:#0b0e13; --card2:#14181f;
    --text:#e8ecf1; --muted:#9aa4b2; --dim:#9aa4b2; --accent:#1f9bd8; --accent2:#3fb0ff;
    --good:#3ccf7a; --warn:#f5b83d; --bad:#ff5a5a;
    --l5:#1fbf8f; --l4:#7bd34a; --l3:#e8c547; --l2:#f08a3c; --l1:#e5484d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-size:14px}
  a{color:var(--accent2)}
  #map{position:fixed;inset:0;z-index:0;background:#0b0e13}
  .leaflet-container{background:#0b0e13}
  .leaflet-top.leaflet-left{top:60px}
  .leaflet-bar a{background:var(--panel-solid)!important;color:var(--text)!important;border-color:var(--line)!important}
  .leaflet-control-attribution{background:rgba(0,0,0,.5)!important;color:#888!important}
  .leaflet-control-attribution a{color:#aaa!important}
  .osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.4)}   /* 밝은 OSM 지도를 어둡게 */
  .tybtn.on{border-color:var(--accent);color:var(--accent2)}
  .leaflet-tooltip{background:var(--panel-solid);color:var(--text);border:1px solid var(--line);box-shadow:none;font-size:12px}
  .leaflet-tooltip:before{display:none}

  /* 상단 바 */
  .topbar{position:fixed;top:12px;left:12px;right:12px;z-index:1001;display:flex;gap:10px;align-items:center;pointer-events:none}
  .topbar>*{pointer-events:auto}
  .brand{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .trip-chip,.tybtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap}
  .trip-chip b{color:var(--accent2)}
  #target{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--text);font:inherit;font-size:13px;max-width:200px}
  .legend{position:fixed;left:12px;bottom:80px;z-index:999;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:11px;color:var(--muted);max-width:calc(100% - 460px)}
  body.hide-timeline .legend{bottom:12px}
  @media (max-width:1200px){ .hint{display:none} }
  .legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 3px 0 7px;vertical-align:-1px}
  .datebox{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .datebox button{background:none;border:0;color:var(--text);font:inherit;padding:9px 10px;cursor:pointer} .datebox button:hover{color:var(--accent2)}
  .datebox input{background:none;border:0;color:var(--text);font:inherit;font-size:13px;padding:7px 2px;color-scheme:dark;width:128px}
  .rcard{position:fixed;top:64px;left:60px;width:330px;max-height:calc(100% - 170px);overflow:auto;z-index:999;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:12px}
  .rcard>header{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .rcard>header b{font-size:13px} .rcard>header .s{color:var(--muted);font-size:11px;margin-left:auto}
  .rcard.folded>header{border-bottom:0} .rcard.folded .rb{display:none}
  .rb{padding:8px 12px 10px;display:flex;flex-direction:column;gap:8px}
  .ritem{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--card2)}
  .ritem.on{border-color:var(--accent)}
  .ritem .t{display:flex;align-items:center;gap:6px} .ritem .t b{font-size:13px}
  .ritem .t .btn{margin-left:auto}
  .ritem .ln{color:var(--muted);margin-top:3px;line-height:1.45} .ritem .ln b{color:var(--text);font-weight:600}
  body.hide-reco #rcard{display:none}
  .hint{margin-left:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted);font-size:12px}

  /* 보기 메뉴 */
  .viewmenu{position:relative}
  .vm-pop{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:230px;background:var(--panel-solid);border:1px solid var(--line);border-radius:12px;padding:8px;z-index:1100;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .viewmenu.open .vm-pop{display:block}
  .vm-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:13px}
  .vm-item:hover{background:#1c222b}
  .vm-item input{accent-color:var(--accent);width:16px;height:16px;margin:0}
  .vm-sep{height:1px;background:var(--line);margin:6px 2px}
  .vm-row{display:flex;gap:6px;padding:4px 2px 0} .vm-row .btn{flex:1}

  /* 오른쪽 계획 패널 */
  .panel{position:fixed;top:64px;right:12px;bottom:12px;width:400px;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;overflow:hidden}
  .panel>header{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;cursor:pointer}
  .panel>header h2{margin:0;font-size:17px}
  .panel>header .sub{color:var(--muted);font-size:12px;margin-top:3px}
  .fold{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 9px;font:inherit;font-size:12px;cursor:pointer;flex:none}
  .panel.folded{bottom:auto} .panel.folded .pbody,.panel.folded .sub{display:none} .panel.folded>header{border-bottom:0}
  .pbody{overflow:auto;padding:12px 14px 16px;flex:1}
  .steps{display:flex;flex-direction:column;gap:8px}
  .step{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
  .step>header{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer}
  .step>header .no{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--line);color:var(--muted);flex:none}
  .step>header .ti{font-weight:700}
  .step>header .sum{margin-left:auto;color:var(--muted);font-size:12px;text-align:right;max-width:55%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .step.done>header .no{background:var(--good);color:#0b0e13}
  .step.active{border-color:var(--accent)} .step.active>header .no{background:var(--accent);color:#fff}
  .step.locked{opacity:.45} .step.locked>header{cursor:not-allowed}
  .step .content{padding:2px 12px 12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
  .row label{color:var(--muted);font-size:12px;min-width:44px}
  .in{background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;color-scheme:dark}
  textarea.in{width:100%;min-height:90px;resize:vertical}
  .btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .spotlist{display:flex;flex-direction:column;gap:6px;margin-top:8px;max-height:300px;overflow:auto}
  .spotitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--card2)}
  .spotitem:hover{border-color:var(--accent)} .spotitem.sel{border-color:var(--accent);background:rgba(31,155,216,.10)}
  .spotitem .meta{margin-left:auto;color:var(--muted);font-size:11px;text-align:right}
  .sdot{width:10px;height:10px;border-radius:50%;flex:none;background:#56636e}
  .star{background:none;border:0;color:var(--muted);font-size:16px;cursor:pointer;padding:0 2px;line-height:1;flex:none} .star.on{color:#ffd54a}
  .favbox{border:1px dashed var(--line);border-radius:9px;padding:8px 10px;margin:8px 0;font-size:12px}
  .reco{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .reco-item{padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card2);cursor:pointer}
  .reco-item:hover{border-color:var(--accent)} .reco-item .d{color:var(--muted);font-size:11px;margin-top:2px}
  table.days{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
  table.days th{color:var(--muted);font-weight:600;text-align:left;padding:5px 4px;border-bottom:1px solid var(--line)}
  table.days td{padding:6px 4px;border-bottom:1px solid #1c222b}
  table.days tr[data-d]{cursor:pointer} table.days tr[data-d]:hover td{background:var(--card2)} table.days tr.cur td{background:rgba(31,155,216,.12)}
  .lvtag{display:inline-block;padding:1px 7px;border-radius:10px;font-weight:700;font-size:11px;color:#0b0e13;white-space:nowrap}
  .summary{white-space:pre-wrap;background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:12px;line-height:1.6}
  .shop{padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:var(--card2);display:flex;gap:8px;align-items:center}
  .shop .n{font-weight:700} .shop .d{color:var(--muted);font-size:12px}

  /* 상세 블록(날씨 및 적합도) */
  h3{font-size:12px;margin:14px 0 6px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:6px}
  .rel{font-size:10px;font-weight:400;border:1px solid var(--line);border-radius:8px;padding:0 5px;color:var(--muted);white-space:nowrap}
  .card{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .note{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .chip{font-size:12px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
  .chip.good{border-color:var(--good);color:var(--good)} .chip.warn{border-color:var(--warn);color:var(--warn)} .chip.bad{border-color:var(--bad);color:var(--bad)}
  .verdict{display:flex;align-items:center;gap:12px}
  .big{font-size:20px;font-weight:700;border-radius:10px;padding:6px 12px;color:#0b0e13;white-space:nowrap}
  table.t{width:100%;border-collapse:collapse;font-size:12px}
  table.t th,table.t td{border-bottom:1px solid var(--line);padding:4px 3px;text-align:center}
  table.t th{color:var(--muted);font-weight:500}
  td.warn{color:var(--warn)} td.bad{color:var(--bad);font-weight:600}
  #hrs{display:grid;grid-template-columns:repeat(24,1fr);gap:1px;margin-top:4px} #hrs div{height:22px;border-radius:2px}
  .hlab{display:grid;grid-template-columns:repeat(8,1fr);font-size:10px;color:var(--muted)}
  .win{display:flex;gap:8px;align-items:baseline;margin-top:4px} .win b{min-width:96px}
  .links{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .links a{display:block;background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-decoration:none;color:var(--text);font-size:12px}
  .links a:hover{border-color:var(--accent)}
  .kl{font-size:12px;padding:2px 0;border-bottom:1px dashed var(--line)} .kl.hit{color:var(--bad);font-weight:600}

  .btn{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap;font:inherit;color:var(--text)}
  .btn:hover{border-color:var(--accent)} .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .btn.sm{padding:3px 8px;font-size:12px}

  /* 하단 시간 바 (Windy 방식) */
  .wtl{position:fixed;left:12px;right:424px;bottom:12px;z-index:1000;display:flex;align-items:stretch;gap:8px;height:58px}
  .wtl-now{width:52px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);font-size:12px;font-weight:700;cursor:pointer}
  .wtl-track{position:relative;flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;user-select:none;touch-action:none}
  .wtl-days{position:absolute;inset:0;display:flex}
  .wtl-day{flex:1;border-left:1px solid var(--line);position:relative}
  .wtl-day:first-child{border-left:0}
  .wtl-day.trip{background:rgba(31,155,216,.12)}
  .wtl-day .lb{position:absolute;left:6px;top:5px;font-size:12px;font-weight:700;white-space:nowrap}
  .wtl-day.today .lb{color:var(--accent2)}
  .wtl-day .hb{position:absolute;left:0;right:0;bottom:10px;height:7px;display:flex}
  .wtl-day .hb i{flex:1}
  .wtl-day .lvb{position:absolute;left:0;right:0;bottom:0;height:5px}
  .wtl-knob{position:absolute;top:0;bottom:0;width:2px;background:#fff;pointer-events:none}
  .wtl-knob span{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap}

  /* 도구 창 */
  .modal{position:fixed;inset:0;z-index:1200;display:none;align-items:flex-start;justify-content:center;padding-top:64px;background:rgba(0,0,0,.35)}
  .modal.open{display:flex}
  .sheet{background:var(--panel-solid);border:1px solid var(--line);border-radius:14px;width:min(760px,calc(100% - 24px));max-height:calc(100% - 140px);display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.55)}
  .sheet header{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .sheet .body{overflow-y:auto;padding:12px 14px 16px}
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .x{margin-left:auto}
  label.f{display:block;font-size:12px;color:var(--muted);margin-top:8px}
  label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:2px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:6px;color:var(--text);font:inherit;color-scheme:dark}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
  .ck{display:flex;align-items:center;gap:6px;padding:3px 0}
  .ck input{width:16px;height:16px;accent-color:var(--good)}
  .ck.done span{color:var(--muted);text-decoration:line-through}
  .ck .del{margin-left:auto;opacity:.4;cursor:pointer;border:0;background:none;color:var(--muted)} .ck .del:hover{opacity:1}
  tr.ban td{color:var(--bad)}
  #toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:8px;z-index:3000;display:none}

  /* 지도 클릭 창 */
  .click-pop .leaflet-popup-content-wrapper{background:var(--panel-solid);color:var(--text);border:1px solid var(--line);border-radius:10px}
  .click-pop .leaflet-popup-tip{background:var(--panel-solid)}
  .click-pop .leaflet-popup-content{margin:9px 12px;font-size:12px;min-width:200px}
  .click-pop .ch{color:var(--muted);font-size:11px;margin-bottom:4px}
  .click-pop .cr{display:flex;align-items:center;gap:6px;margin:3px 0}
  .click-pop .ck2{width:30px;color:var(--muted)}
  .click-pop b{font-size:15px} .click-pop b.warn{color:var(--warn)} .click-pop b.bad{color:var(--bad)}
  .click-pop .cm{color:var(--muted);font-size:11px}

  body.hide-panel #panel{display:none}
  body.hide-panel .wtl, body.fold-panel .wtl{right:12px}
  body.hide-timeline #wtl{display:none}
  body.hide-legend #legend{display:none}
  body.hide-hint #hint{display:none}
  @media (max-width:760px){
    .hint,.brand{display:none}
    .topbar{left:8px;right:8px;top:8px;flex-wrap:wrap;gap:6px}
    .trip-chip,.tybtn,#target{padding:9px 10px;min-height:40px;font-size:13px}
    #target{order:9;flex:1 1 100%;min-width:0;max-width:none}   /* 폰에선 대상어 고르기를 둘째 줄 전체 폭으로 */
    .legend{left:8px;right:8px;max-width:none;bottom:calc(58vh + 80px);font-size:10px;padding:4px 8px}
    body.fold-panel .legend{bottom:136px} body.hide-panel .legend{bottom:74px} body.hide-timeline .legend{bottom:calc(58vh + 16px)}
    .leaflet-top.leaflet-left{top:150px}
    .rcard{left:8px;right:8px;width:auto;top:104px;max-height:40vh}
    .datebox input{width:112px}
    .step>header{padding:13px 12px} .btn{min-height:38px} .btn.sm{min-height:32px}
    .links{grid-template-columns:1fr}
    .sheet{max-height:calc(100% - 80px)} .modal{padding-top:56px}
    .panel{top:auto;left:8px;right:8px;bottom:8px;width:auto;height:58vh}
    .panel.folded{height:auto;bottom:8px;top:auto}
    .wtl{left:8px;right:8px;bottom:calc(58vh + 14px)}
    body.fold-panel .wtl{bottom:70px} body.hide-panel .wtl{bottom:8px}
  }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar">
  <div class="brand"><span class="dot"></span>낚시 날씨</div>
  <div class="datebox" title="출조 날짜"><button id="dPrev" title="하루 앞">◀</button><input type="date" id="dPick"><button id="dNext" title="하루 뒤">▶</button></div>
  <div class="trip-chip" id="tripChip" title="일정 바꾸기">일정 —</div>
  <select id="target" title="대상어(낚시 방식)"></select>
  <div class="viewmenu" id="viewMenu"><button class="tybtn" id="viewBtn">보기 ▾</button><div class="vm-pop" id="vmPop"></div></div>
  <button class="tybtn" id="satBtn" title="위성사진으로 보기">위성</button>
  <button class="tybtn" id="shareBtn" title="이 계획을 다른 사람에게">공유</button>
  <button class="tybtn" id="toolsBtn" title="조과 기록·금어기·설정">도구</button>
  <div class="legend" id="legend"></div>
  <div class="hint" id="hint"></div>
</div>
<section class="rcard" id="rcard"></section>
<aside class="panel" id="panel">
  <header id="pHead"><div><h2>낚시 계획</h2><div class="sub">일정부터 차례로 진행하세요 · 언제든 단계를 눌러 수정</div></div><button class="fold" id="panelFold">접기 ▴</button></header>
  <div class="pbody"><div class="steps" id="steps"></div></div>
</aside>
<div class="wtl" id="wtl">
  <button class="wtl-now" id="nowBtn" title="지금 시각으로">지금</button>
  <div class="wtl-track" id="track"><div class="wtl-days" id="tlDays"></div><div class="wtl-knob" id="knob"><span id="knobLbl">-</span></div></div>
</div>
<div class="modal" id="modal"><div class="sheet"><header id="mh"></header><div class="body" id="mb"></div></div></div>
<div id="toast"></div>
<script>
/* ══════════ 설정 (바꾸기 쉬운 것은 여기 모음) ══════════ */

/* 물때 지점 = 기본 포인트. bt = 바다타임 지점 번호(badatime.com/{bt}/tide). 좌표는 항구 근처 대략값 (다이빙 앱과 같은 목록) */
const STATIONS = [

const SYN=29.530588853, NM_REF=Date.UTC(2000,0,6,18,14);
function lunarInfo(ds){
  const noon=Date.parse(ds+'T12:00:00+09:00'), age=(((noon-NM_REF)/864e5)%SYN+SYN)%SYN;
  const nm=new Date(noon-age*864e5+9*3600e3), nmDay=Date.UTC(nm.getUTCFullYear(),nm.getUTCMonth(),nm.getUTCDate());
  const ld=Math.round((Date.parse(ds+'T00:00:00Z')-nmDay)/864e5)+1, n=((ld-8)%15+15)%15;
  return {ld, mul:n===0?'조금':n+'물', flow:0.5+0.5*Math.cos(2*Math.PI*(n-7.5)/15)};   // flow: 조금 0 → 사리 1
}
/* 일출·일몰 (NOAA 계산식, 한국 시각) */
function sunTimes(date,lat,lon){
  const d=new Date(date+'T12:00:00Z'), J=d/864e5+2440587.5, n=Math.round(J-2451545.0+0.0008);
  const Js=n-lon/360, M=(357.5291+0.98560028*Js)%360, r=Math.PI/180;
  const C=1.9148*Math.sin(M*r)+0.02*Math.sin(2*M*r)+0.0003*Math.sin(3*M*r), lam=(M+C+180+102.9372)%360;
  const Jt=2451545+Js+0.0053*Math.sin(M*r)-0.0069*Math.sin(2*lam*r), dec=Math.asin(Math.sin(lam*r)*Math.sin(23.4397*r));
  const cw=(Math.sin(-0.833*r)-Math.sin(lat*r)*Math.sin(dec))/(Math.cos(lat*r)*Math.cos(dec)); if(cw<-1||cw>1) return null;
  const w=Math.acos(cw)/r, toMinK=j=>{ const t=new Date((j-2440587.5)*864e5+9*3600e3); return t.getUTCHours()*60+t.getUTCMinutes(); };
  return {rise:toMinK(Jt-w/360), set:toMinK(Jt+w/360)};
}
function inBan(reg,date){
  if(!reg||!reg.ban) return false;
  const x=date.slice(5), [a,b]=reg.ban;
  return a<=b? (x>=a&&x<=b) : (x>=a||x<=b);
}

/* ══════════ 날씨 자료 (Open-Meteo, 키 없음) ══════════

const OM='https://api.open-meteo.com/v1/forecast', OMM='https://marine-api.open-meteo.com/v1/marine';
async function omGet(url){

let PUBWX=null;
async function loadPubWx(){
  if(HELPER) return;   // 내 맥·와이파이 판은 도우미가 있으니 직접 받음(공용 파일은 공개판에만 있음)
  try{ const r=await fetch('data/wx.json',{cache:'no-cache'}); if(!r.ok) return; const j=await r.json(); if(!j.ts||Date.now()-j.ts>14*3600e3) return;
    const conv=(o,f)=>{ const out={}; for(const id in o){ out[id]={}; for(const d in o[id]){ const a=o[id][d], x={}; f.forEach((k,i)=>{ if(a[i]!=null) x[k]=a[i]; }); out[id][d]=x; } } return out; };
    PUBWX={t:j.t, spots:conv(j.spots,j.f.spot), grid:conv(j.grid,j.f.grid)};
  }catch(e){}
}
async function loadDaily(){

  if(!spots.length){ dailyErr=''; SC.clear(); return; }

  const la=spots.map(s=>s.lat.toFixed(3)).join(','), lo=spots.map(s=>s.lon.toFixed(3)).join(',');
  try{
    const [fc,sea]=await Promise.all([
      omGet(`${OM}?latitude=${la}&longitude=${lo}&daily=wind_speed_10m_max,wind_gusts_10m_max,precipitation_sum,temperature_2m_max,temperature_2m_min,weather_code&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=14`),
      omGet(`${OMM}?latitude=${la}&longitude=${lo}&daily=wave_height_max&hourly=sea_surface_temperature&timezone=Asia%2FSeoul&forecast_days=14`)]);
    const F=Array.isArray(fc)?fc:[fc], M=Array.isArray(sea)?sea:[sea], data={};
    spots.forEach((s,i)=>{
      const f=F[i]&&F[i].daily, m=M[i]||{}, out={};
      if(f) f.time.forEach((d,j)=>{ out[d]={wind:f.wind_speed_10m_max[j], gust:f.wind_gusts_10m_max[j], rain:f.precipitation_sum[j], tmax:f.temperature_2m_max[j], tmin:f.temperature_2m_min[j], code:f.weather_code[j]}; });
      if(m.daily) m.daily.time.forEach((d,j)=>{ (out[d]=out[d]||{}).wave=m.daily.wave_height_max[j]; });
      if(m.hourly){ const acc={}; m.hourly.time.forEach((t,j)=>{ const v=m.hourly.sea_surface_temperature[j]; if(v==null) return; const d=t.slice(0,10); (acc[d]=acc[d]||[]).push(v); });
        for(const d in acc){ (out[d]=out[d]||{}).sst=acc[d].reduce((a,b)=>a+b,0)/acc[d].length; } }
      data[s.id]=out;

/* ══════════ 바다 상태 색 지도 (0.5° 격자 약 195칸) ══════════
   해양 예보를 먼저 받아 바다 칸만 고르고(육지 칸은 파고가 없음 → 그 목록은 계속 기억), 바다 칸만 날씨 예보를 받음. 1시간 저장.
   Open-Meteo는 지점 1개 = 요청 1회로 세서(분당 600) 격자를 촘촘히 하지 않음. 칸 사이는 그림을 부드럽게 늘려 이어 보이게 함. */
const G={lat0:32.5, lon0:124.0, dl:0.5, rows:14, cols:16};   // 32.25~39.25°N, 123.75~131.75°E — 지도 범위보다 넓게 받아 색 영역 테두리가 화면에 안 보이게
let GRIDD={}, gridErr='', gridLayer=null, gridWind=true, gridVer=0;
const GRIDIMG=new Map();   // 날짜·대상어별로 그린 그림을 기억 → 시간 바로 날짜를 옮길 때 다시 그리지 않음
const gpt=(r,c)=>({id:`g${r}_${c}`, lat:G.lat0+r*G.dl, lon:G.lon0+c*G.dl});
async function loadGrid(){
  if(PUBWX&&Object.keys(PUBWX.grid).length){ GRIDD=PUBWX.grid; gridVer++; gridWind=true; gridErr=''; SC.clear(); return; }
  const c=ls.get('fish.grid2',null);
  if(c&&Date.now()-c.t<3*3600e3&&c.day===TODAY){ GRIDD=c.data; gridVer++; SC.clear(); return; }   // 넓은 지도 색은 3시간 저장
  let sea=ls.get('fish.gridsea2',null);
  const all=[]; for(let r=0;r<G.rows;r++) for(let k=0;k<G.cols;k++) all.push(gpt(r,k));
  const q=pts=>`latitude=${pts.map(p=>p.lat).join(',')}&longitude=${pts.map(p=>p.lon).join(',')}`;
  try{
    const mPts=sea? all.filter(p=>sea.includes(p.id)) : all;
    const M=[].concat(await omGet(`${OMM}?${q(mPts)}&daily=wave_height_max&hourly=sea_surface_temperature&timezone=Asia%2FSeoul&forecast_days=14`));
    const data={};
    mPts.forEach((p,i)=>{ const m=M[i]; if(!m||!m.daily) return; const w=m.daily.wave_height_max; if(!w.some(v=>v!=null)) return;
      const out={}; m.daily.time.forEach((d,j)=>out[d]={wave:w[j]});
      const acc={}; (m.hourly?m.hourly.time:[]).forEach((t,j)=>{ const v=m.hourly.sea_surface_temperature[j]; if(v==null) return; (acc[t.slice(0,10)]=acc[t.slice(0,10)]||[]).push(v); });
      for(const d in acc) (out[d]=out[d]||{}).sst=acc[d].reduce((a,b)=>a+b,0)/acc[d].length;
      data[p.id]=out; });
    if(!sea) ls.set('fish.gridsea2',Object.keys(data));
    GRIDD=data; gridVer++; SC.clear(); gridWind=false; drawGrid();   // 파고·수온 먼저 그림(바람 예보는 칸이 많으면 30초 넘게 걸릴 때가 있음)
    const sPts=all.filter(p=>data[p.id]);
    const F=[].concat(await omGet(`${OM}?${q(sPts)}&daily=wind_speed_10m_max,wind_gusts_10m_max,precipitation_sum&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=14`));
    sPts.forEach((p,i)=>{ const f=F[i]&&F[i].daily; if(!f) return; f.time.forEach((d,j)=>Object.assign(data[p.id][d]=data[p.id][d]||{}, {wind:f.wind_speed_10m_max[j], gust:f.wind_gusts_10m_max[j], rain:f.precipitation_sum[j]})); });
    GRIDD=data; gridVer++; SC.clear(); gridWind=true; gridErr=''; ls.set('fish.grid2',{t:Date.now(),day:TODAY,data});
  }catch(e){ gridErr=e.message; if(c&&c.data){ GRIDD=c.data; gridVer++; SC.clear(); } setTimeout(()=>loadGrid().then(drawGrid),90e3); }
}
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const LV5HEX={'매우좋음':'#1fbf8f','좋음':'#7bd34a','보통':'#e8c547','나쁨':'#f08a3c','매우나쁨':'#e5484d'};
function cellColor(mode,p,date){   // 지도 색 = 낚시 컨디션 5단계(금어기는 회색)

/* 육지 가리기: 바다 예보 서버가 육지 칸에도 값을 줘서, 세계 해안선(Natural Earth 1:10m)으로 육지를 지움.
   한반도 주변만 잘라 좌표를 줄여 저장해 두고 계속 씀(처음 한 번 약 0.8MB 받음) */
let LAND=null;
async function loadLand(){
  if(LAND) return LAND;
  const c=ls.get('fish.land.v3',null); if(c){ LAND=c; return LAND; }
  try{
    const topo=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/land-10m.json').then(r=>r.json());
    const geo=topojson.feature(topo, topo.objects.land), polys=[];
    const geoms=geo.features? geo.features.map(f=>f.geometry) : [geo.geometry];
    geoms.forEach(g=>(g.type==='Polygon'?[g.coordinates]:g.coordinates).forEach(poly=>{
      const ring=poly[0]; if(!ring.some(([x,y])=>x>=G.lon0-2&&x<=G.lon0+G.cols*G.dl+2&&y>=G.lat0-2&&y<=G.lat0+G.rows*G.dl+2)) return;
      const x0=G.lon0-1.5, x1=G.lon0+G.cols*G.dl+1, y0=G.lat0-1.5, y1=G.lat0+G.rows*G.dl+1;
      // 범위 밖 점은 범위 테두리로 붙이고(대륙 해안선 전체를 들고 있지 않게), 약 1km보다 촘촘한 점은 생략
      const thin=r=>{ const o=[]; let px=1e9,py=1e9; r.forEach(([x,y])=>{ x=Math.min(x1,Math.max(x0,x)); y=Math.min(y1,Math.max(y0,y)); if(Math.abs(x-px)+Math.abs(y-py)>=0.008){ o.push([+x.toFixed(3),+y.toFixed(3)]); px=x; py=y; } }); return o; };
      const pp=poly.map(thin).filter(r=>r.length>=3); if(pp.length) polys.push(pp);
    }));
    LAND=polys; ls.set('fish.land.v3',polys);
  }catch(e){ LAND=[]; }
  return LAND;
}
const mercY=lat=>Math.log(Math.tan(Math.PI/4+lat*Math.PI/360));
function drawGrid(){
  renderLegend();
  if(!VIEW.sea||!Object.keys(GRIDD).length){ if(gridLayer){ map.removeLayer(gridLayer); gridLayer=null; } return; }
  const h=G.dl/2, W0=G.lon0-h, W1=G.lon0+(G.cols-1)*G.dl+h, S0=G.lat0-h, N0=G.lat0+(G.rows-1)*G.dl+h;
  const gk=[ST.date,ST.target,gridWind,gridVer,LAND?LAND.length:0].join('|');
  let url=GRIDIMG.get(gk);
  if(!url){
  const small=document.createElement('canvas'); small.width=G.cols; small.height=G.rows;
  const cx=small.getContext('2d'), img=cx.createImageData(G.cols,G.rows);
  for(let r=0;r<G.rows;r++) for(let c=0;c<G.cols;c++){
    const col=cellColor('score',gpt(r,c),ST.date); if(!col) continue;
    const i=((G.rows-1-r)*G.cols+c)*4; img.data[i]=col[0]; img.data[i+1]=col[1]; img.data[i+2]=col[2]; img.data[i+3]=150;
  }
  cx.putImageData(img,0,0);
  const big=document.createElement('canvas'), k=48; big.width=G.cols*k; big.height=G.rows*k;
  // 두 배씩 여러 번 키우면 한 번에 키울 때보다 칸 경계가 부드러워짐(계단·마름모 무늬 줄이기)
  let src=small; while(src.width*2<big.width){ const c2=document.createElement('canvas'); c2.width=src.width*2; c2.height=src.height*2; const x2=c2.getContext('2d'); x2.imageSmoothingEnabled=true; x2.imageSmoothingQuality='high'; x2.drawImage(src,0,0,c2.width,c2.height); src=c2; }
  const bx=big.getContext('2d'); bx.imageSmoothingEnabled=true; bx.imageSmoothingQuality='high'; bx.drawImage(src,0,0,big.width,big.height);
  if(LAND&&LAND.length){   // 지도 그림은 메르카토르로 늘어나므로 같은 방식으로 좌표를 옮겨 육지를 지움
    const yT=mercY(N0), yB=mercY(S0), X=x=>(x-W0)/(W1-W0)*big.width, Y=y=>(yT-mercY(y))/(yT-yB)*big.height;
    bx.globalCompositeOperation='destination-out'; bx.fillStyle='#000';
    LAND.forEach(poly=>{ bx.beginPath(); poly[0].forEach(([x,y],i)=>i?bx.lineTo(X(x),Y(y)):bx.moveTo(X(x),Y(y))); bx.fill('nonzero'); });   // 바깥 테두리만(호수 구멍은 무시)
    bx.globalCompositeOperation='source-over';
  }
  { // 격자 바깥 테두리를 부드럽게 흐리게(네모 모서리가 보이지 않게)
    const W=big.width, H=big.height, f=Math.round(Math.min(W,H)*0.05);   // 가장자리 약 10%를 서서히 투명하게
    const m=document.createElement('canvas'); m.width=W; m.height=H; const mx=m.getContext('2d');
    mx.fillStyle='#000'; mx.filter=`blur(${f}px)`; mx.fillRect(f,f,W-2*f,H-2*f);   // 안쪽만 불투명 → 흐리게 → 가장자리로 갈수록 투명
    bx.globalCompositeOperation='destination-in'; bx.drawImage(m,0,0);
    bx.globalCompositeOperation='source-over';
  }
  url=big.toDataURL(); GRIDIMG.set(gk,url); if(GRIDIMG.size>30) GRIDIMG.delete(GRIDIMG.keys().next().value);
  }
  if(gridLayer) gridLayer.setUrl(url); else gridLayer=L.imageOverlay(url,[[S0,W0],[N0,W1]],{pane:'grid',opacity:.85,interactive:false}).addTo(map);
}
const HOURLY=new Map();
async function loadHourly(spot){
  const k=spot.lat.toFixed(2)+','+spot.lon.toFixed(2);
  if(HOURLY.has(k)) return HOURLY.get(k);
  const store=ls.get('fish.hourly',{}), c=store[k];
  if(c&&Date.now()-c.t<3600e3&&c.day===TODAY){ HOURLY.set(k,c); return c; }
  const [fc,sea]=await Promise.all([
    omGet(`${OM}?latitude=${spot.lat}&longitude=${spot.lon}&hourly=wind_speed_10m,wind_gusts_10m,wind_direction_10m,temperature_2m,precipitation,weather_code,pressure_msl&wind_speed_unit=ms&timezone=Asia%2FSeoul&forecast_days=14`),
    omGet(`${OMM}?latitude=${spot.lat}&longitude=${spot.lon}&hourly=wave_height,wave_period,wave_direction,sea_surface_temperature,sea_level_height_msl&timezone=Asia%2FSeoul&forecast_days=14`).catch(()=>null)]);
  const v={t:Date.now(), day:TODAY, fc:fc.hourly, sea:sea&&sea.hourly};
  HOURLY.set(k,v); SC.clear();
  const keys=Object.keys(store).sort((a,b)=>store[b].t-store[a].t).slice(0,7), next={}; keys.forEach(x=>next[x]=store[x]); next[k]=v; ls.set('fish.hourly',next);
  return v;
}
const hval=(o,key,date,h)=>{ if(!o||!o[key]) return null; const i=o.time.indexOf(`${date}T${pad(h)}:00`); return i<0?null:o[key][i]; };
/* 지도 일괄 자료가 없는 포인트(임시 지점)는 시간별 자료로 하루 값을 만듦 */
function dayData(spot,date){
  const d=(DAILY[spot.id]||GRIDD[spot.id]||{})[date]; if(d) return d;
  const H=HOURLY.get(spot.lat.toFixed(2)+','+spot.lon.toFixed(2)); if(!H) return null;
  const col=(o,k)=>Array.from({length:24},(_,h)=>hval(o,k,date,h)).filter(x=>x!=null);
  const w=col(H.fc,'wind_speed_10m'); if(!w.length) return null;
  const g=col(H.fc,'wind_gusts_10m'), p=col(H.fc,'precipitation'), t=col(H.fc,'temperature_2m'), wv=col(H.sea,'wave_height'), s=col(H.sea,'sea_surface_temperature');
  return {wind:Math.max(...w), gust:g.length?Math.max(...g):null, rain:p.reduce((a,b)=>a+b,0), tmax:Math.max(...t), tmin:Math.min(...t),
          wave:wv.length?Math.max(...wv):null, sst:s.length?s.reduce((a,b)=>a+b,0)/s.length:null};
}

/* ══════════ 판정 ══════════ */
function safety(d){
  const why=[]; let lv='good';
  if(d.wave!=null){ if(d.wave>=SAFE.waveBad){lv='bad';why.push(`파고 ${r1(d.wave)}m`);} else if(d.wave>=SAFE.waveWarn){lv='warn';why.push(`파고 ${r1(d.wave)}m`);} }
  if(d.wind!=null){ if(d.wind>=SAFE.windBad){lv='bad';why.push(`풍속 ${r1(d.wind)}m/s`);} else if(d.wind>=SAFE.windWarn){ if(lv!=='bad') lv='warn'; why.push(`풍속 ${r1(d.wind)}m/s`);} }
  if(d.gust!=null&&d.gust>=SAFE.gustBad){ lv='bad'; why.push(`돌풍 ${r1(d.gust)}m/s`); }
  return {lv,why};
}
const LV5=[{min:80,n:'매우좋음',c:'var(--l5)'},{min:65,n:'좋음',c:'var(--l4)'},{min:45,n:'보통',c:'var(--l3)'},{min:25,n:'나쁨',c:'var(--l2)'},{min:-1,n:'매우나쁨',c:'var(--l1)'}];
const lv5=sc=>LV5.find(l=>sc>=l.min);
const SC=new Map();   // 판정 기억: 예보 자료가 바뀔 때 비움
function score(spot,date,t=T()){
  const k=spot.id+'|'+spot.lat+'|'+date+'|'+t.id; let r=SC.get(k);
  if(r===undefined){ r=scoreRaw(spot,date,t); if(r) SC.set(k,r); }
  return r||null;
}
function scoreRaw(spot,date,t){
  const d=dayData(spot,date); if(!d) return null;
  let sc=50; const plus=[], minus=[], mo=+date.slice(5,7);
  if(t.best.includes(mo)){sc+=15;plus.push('제철');} else if(t.ok.includes(mo)){sc+=5;plus.push('시즌 초입·끝물');} else {sc-=20;minus.push('비시즌');}
  if(d.sst!=null){ const s=d.sst;
    if(s>=t.opt[0]&&s<=t.opt[1]){sc+=15;plus.push(`수온 ${r1(s)}℃ 적당`);} else if(s>=t.sst[0]&&s<=t.sst[1]){sc+=5;} else {sc-=20;minus.push(`수온 ${r1(s)}℃ ${s<t.sst[0]?'낮음':'높음'}`);} }
  const L=lunarInfo(date), f=L.flow;
  const fok= t.flow==='low'? f<0.5 : t.flow==='high'? f>=0.6 : (f>=0.3&&f<=0.85);
  if(fok){sc+=10;plus.push(`${L.mul} 물때 맞음`);} else {sc-=5;minus.push(`${L.mul}`);}
  if(t.region){ const b=t.region(spot.lat,spot.lon); sc+=b; if(b>0) plus.push('잘 나오는 해역'); if(b<0) minus.push('드문 해역'); }

/* 만조·간조 시각(바다타임) 사이를 코사인으로 이어 시간별 높이를 만듦. 없으면 해양 예보의 해수면 높이 사용(추정) */
function tideCurve(spot,date,H){
  const st=nearestSt(spot.lat,spot.lon), td=TIDE[st.s.bt];
  if(td&&td.days&&td.days.length){
    const pts=[]; [-1,0,1].forEach(k=>{ const dd=addDays(date,k), day=td.days.find(x=>x.date===dd); if(day) day.ext.forEach(e=>pts.push({m:toMin(e.time)+k*1440, h:e.h, k:e.k})); });
    pts.sort((a,b)=>a.m-b.m);
    const today=td.days.find(x=>x.date===date);
    if(today&&pts.length>=2){
      const at=m=>{ for(let i=0;i<pts.length-1;i++){ const a=pts[i],b=pts[i+1]; if(m>=a.m&&m<=b.m){ const x=(m-a.m)/(b.m-a.m); return a.h+(b.h-a.h)*(1-Math.cos(Math.PI*x))/2; } } return null; };
      return {src:'badatime', name:st.s.n, km:st.km, bt:st.s.bt, mul:today.mul, flow:today.flow, ext:today.ext.map(e=>({...e})), at};
    }
  }
  const sl=H&&H.sea&&H.sea.sea_level_height_msl; if(!sl) return null;
  const vals=Array.from({length:26},(_,h)=>hval(H.sea,'sea_level_height_msl',h<24?date:addDays(date,1),h%24));
  if(vals.filter(v=>v!=null).length<20) return null;
  const at=m=>{ const h=m/60, i=Math.floor(h); if(i<0||i>=25||vals[i]==null||vals[i+1]==null) return null; return (vals[i]+(vals[i+1]-vals[i])*(h-i))*100; };
  const ext=[]; for(let h=1;h<24;h++){ const a=vals[h-1],b=vals[h],c=vals[h+1]; if(a==null||b==null||c==null) continue;
    if(b>a&&b>=c) ext.push({k:'만조',time:pad(h)+':00',h:Math.round(b*100)}); if(b<a&&b<=c) ext.push({k:'간조',time:pad(h)+':00',h:Math.round(b*100)}); }
  const L=lunarInfo(date);
  return {src:'est', name:st.s.n, km:st.km, bt:st.s.bt, mul:L.mul, flow:Math.round(L.flow*100), ext, at};
}
function hourScores(spot,date,H,tc,t=T()){
  const sun=sunTimes(date,spot.lat,spot.lon), out=[];
  let maxRate=0; const rate=[];
  for(let h=0;h<24;h++){ const m=h*60+30, a=tc&&tc.at(m-30), b=tc&&tc.at(m+30); const r=(a!=null&&b!=null)?b-a:null; rate.push(r); if(r!=null) maxRate=Math.max(maxRate,Math.abs(r)); }
  const turns=tc? tc.ext.map(e=>toMin(e.time)) : [];
  for(let h=0;h<24;h++){
    const m=h*60+30; let sc=40; const why=[];
    const r=rate[h], rel=(r!=null&&maxRate)?Math.abs(r)/maxRate:null;
    if(rel!=null){
      if(t.flow==='low'){ sc+=Math.round(20*(1-rel)); } else if(t.flow==='high'){ sc+=Math.round(25*rel); } else { sc+=Math.round(20*(1-Math.abs(rel-0.6)/0.6)); }
      if(rel>0.4) why.push(r>0?'들물':'날물');
    }
    if(turns.some(x=>Math.abs(x-m)<=75)){ sc+=10; why.push('물돌이 전후'); }
    if(sun){
      const maz=Math.min(Math.abs(m-sun.rise),Math.abs(m-sun.set))<=70, night=m<sun.rise-40||m>sun.set+40;
      if(t.time==='mazume'&&maz){sc+=25;why.push(Math.abs(m-sun.rise)<=70?'아침 피딩':'저녁 피딩');}
      if(t.time==='night'){ if(night){sc+=20;why.push('밤');} else if(!maz) sc-=10; if(maz){sc+=10;why.push('해질녘');} }
      if(t.time==='day'&&!night){sc+=10;} if(t.time==='day'&&maz){sc+=5;}
      if(t.time==='mazume'&&night) sc-=5;
    }
    const w=hval(H&&H.fc,'wind_speed_10m',date,h), wv=hval(H&&H.sea,'wave_height',date,h), p=hval(H&&H.fc,'precipitation',date,h);
    if(w!=null){ if(w>=SAFE.windBad){sc-=40;why.push('강풍');} else if(w>=SAFE.windWarn){sc-=20;why.push('바람');} }
    if(wv!=null){ if(wv>=SAFE.waveBad){sc-=40;why.push('높은 파도');} else if(wv>=SAFE.waveWarn){sc-=15;why.push('파도');} }
    if(p!=null&&p>=2){sc-=10;why.push('비');}
    out.push({h, sc:Math.max(0,Math.min(100,sc)), why});
  }
  return out;
}
function bestWindows(hs){
  const sorted=[...hs].sort((a,b)=>b.sc-a.sc), cut=Math.max(60,sorted[Math.min(4,sorted.length-1)].sc);
  const wins=[]; let cur=null;
  hs.forEach(x=>{ if(x.sc>=cut){ if(cur&&cur.e===x.h-1){cur.e=x.h;cur.items.push(x);} else {cur={s:x.h,e:x.h,items:[x]};wins.push(cur);} } });
  return wins.map(w=>({...w, sc:Math.max(...w.items.map(i=>i.sc)), why:[...new Set(w.items.flatMap(i=>i.why))].filter(x=>!['바람','파도','비'].includes(x))}))
    .sort((a,b)=>b.sc-a.sc).slice(0,3);
}

async function loadPoint(){
  const sp=trip.point; if(!sp) return; const seq=++ptSeq; ptErr='';

function stepState(id){
  if(trip.active===id) return 'active';
  if(trip.done[id]) return 'done';
  const i=FLOW.findIndex(f=>f.id===id); return (i===0||trip.done[FLOW[i-1].id])? 'open' : 'locked';
}
function openStep(id){ if(stepState(id)==='locked') return; if(VIEW.fold){ VIEW.fold=0; saveView(); applyView(); } trip.active=trip.active===id?null:id; saveTrip(); renderSteps(); }

function stepSummary(id){
  const days=tripDays();
  switch(id){
    case 'plan': return `${md(days[0])}${days.length>1?' – '+md(days[days.length-1]):''} · ${nightsLabel(trip.nights)} · ${T().n}`;
    case 'spot': return trip.point? trip.point.n : '';
    case 'wx': { const r=trip.point&&tripScore(trip.point); return r? `${trip.nights?'평균 ':''}${r.ban?'금어기':r.lv.n} ${r.sc}점` : ''; }

    case 'gear': { const g=GEARST[ST.target]; return g&&g.done&&g.done.length? `${g.done.length}개 챙김` : ''; }
    case 'note': return trip.note? trip.note.slice(0,20) : '';
  }
  return '';
}

    return `<section class="step ${st}" data-id="${f.id}"><header data-open="${f.id}"><span class="no">${st==='done'?'✓':i+1}</span><span class="ti">${f.t}</span><span class="sum">${esc(stepSummary(f.id))}</span></header>${st==='active'?`<div class="content" id="sc">${stepContent(f.id)}</div>`:''}</section>`; }).join('');

let RECO=[];
function recoList(){
  const t=T(), spots=ST.favs.length? allSpots().filter(s=>ST.favs.includes(s.id)) : allSpots(), n=trip.nights, out=[];
  spots.forEach(s=>{ let best=null;
    for(let i=0;i+n<RANGE.length;i++){ const ds=RANGE.slice(i,i+n+1), rs=ds.map(d=>score(s,d,t)); if(rs.some(r=>!r||r.ban||r.sf.lv==='bad')) continue;
      const sc=Math.round(rs.reduce((a,r)=>a+r.sc,0)/rs.length); if(!best||sc>best.sc) best={s,d:ds[0],sc,why:rs[0].plus}; }
    if(best) out.push(best); });
  return out.sort((a,b)=>b.sc-a.sc||a.d.localeCompare(b.d)).slice(0,6);
}

    html+=`<h3>날씨 <span class="rel">Open-Meteo 예보</span></h3><table class="t"><tr><th>시각</th><th>풍속/돌풍(m/s)</th><th>파고(m)/주기</th><th>수온(℃)</th><th>기온(℃)</th><th>강수(mm)</th></tr>${rows}</table>`;

      : `<div class="note">40km 안에 공식 지수 지점이 없거나 이 날짜(예측 7일)를 벗어났어요.</div>`;

  }
  html+=`<h3>금어기·금지체장</h3><div class="card">${reg? `<div><b>${esc(t.n)}</b> — 금어기 ${reg.ban?reg.ban.join('~'):'없음'}${reg.maybe?' 중 1개월(고시 확인)':''} · 금지체장 ${esc(reg.size||'없음')}${reg.note?`<div class="note">${esc(reg.note)}</div>`:''}</div>` : `<div>${esc(t.n)}: ${esc((regOf(t.n.split('(')[0])||{}).note||'시행령 별표에 없음')}</div>`}
    ${bansToday.length?`<div class="chips">${bansToday.map(x=>`<span class="chip ${x.maybe?'warn':'bad'}">${esc(x.n)} ${x.maybe?'금어기 가능':'금어기'}</span>`).join('')}</div>`:'<div class="note">이 날 금어기인 주요 어종 없음</div>'}</div>`;
  html+=`<h3>기상특보·해상예보 <span class="rel">기상청</span></h3>`;
  if(!HELPER) html+=`<div class="note">도우미를 켜면 여기에 바로 떠요. 지금은 아래 링크로.</div>`;
  else {
    const W=KMA.warn, S=z&&KMA.sea[z.btm], hit=l=>z&&z.keys.some(k=>k&&l.replace(/\s/g,'').includes(k.replace(/\s/g,'')));

      ${krows.length?`<table class="t"><tr><th></th><th>날씨</th><th>풍향</th><th>풍속(m/s)</th><th>파고(m)</th></tr>${krows.flatMap(x=>['am','pm'].map((k,i)=>x[k]?`<tr><td>${i?'오후':'오전'}</td><td>${esc((x.wx||[])[i]||'')}</td><td>${esc(x[k].dir)}</td><td>${esc(x[k].wind)}</td><td>${esc(x[k].wave)}</td></tr>`:'')).join('')}</table>`:`<div class="note">${S?'기상청 해상 단기예보 범위(약 3일) 밖의 날짜예요.':'해상예보 불러오는 중…'}</div>`}`}
      ${!near?'<div class="note">현재 발효 중인 특보는 오늘 기준이에요. 출조 1~2일 전에 다시 확인하세요.</div>':''}</div>`;
  }
  const bt=st.s.bt;
  html+=`<h3>바로가기</h3><div class="links">
    <a href="https://www.badatime.com/${bt}/tide" target="_blank" rel="noopener">바다타임 물때표 ↗<div class="note" style="margin:0">${esc(st.s.n)}</div></a>
    <a href="https://www.badatime.com/${bt}/graph/${d}" target="_blank" rel="noopener">바다타임 물때 그래프 ↗<div class="note" style="margin:0">${md(d)}</div></a>

    <a href="https://www.badatime.com/cctv" target="_blank" rel="noopener">실시간 바다영상 ↗</a>
    <a href="https://www.khoa.go.kr/oceangrid/gis/category/observe/observeSearch.do" target="_blank" rel="noopener">바다누리 실시간 조위·관측 ↗</a>
    <a href="https://www.windy.com/?${s.lat},${s.lon},10" target="_blank" rel="noopener">Windy 바람·파도 ↗</a>

    <a href="https://www.weather.go.kr/w/ocean/forecast/daily-forecast.do" target="_blank" rel="noopener">기상청 해상예보 ↗</a></div>`;
  return html;
}


/* ══════════ 추천 시간 · 이번 시기 추천 대상어 ══════════ */
/* 그날 가장 좋은 시간대(대상어별). 포인트의 시간별 예보가 있으면 물때·해·바람으로 계산, 없으면 해 뜰·질 무렵으로 대략 */
function bestTime(s,d,t=T()){
  const H=s&&HOURLY.get(hkey(s));
  if(H){ const hs=hourScores(s,d,H,tideCurve(s,d,H),t), w=bestWindows(hs)[0]; if(w) return {s:w.s, e:w.e+1, why:w.why, est:false}; }
  const sun=sunTimes(d,(s||{lat:36}).lat,(s||{lon:128}).lon); if(!sun) return null;
  const h=m=>Math.max(0,Math.min(24,Math.round(m/60)));
  if(t.time==='night') return {s:h(sun.set), e:Math.min(24,h(sun.set)+4), why:['해 진 뒤'], est:true};
  if(t.time==='mazume') return {s:h(sun.rise-60), e:h(sun.rise+90), why:['아침 피딩'], est:true};
  return {s:9, e:15, why:['낮 물돌이 전후'], est:true};
}
const timeTxt=b=> b? `${pad(b.s)}~${pad(b.e%24)}시` : '-';
let RECO_TG=[];
function fillTargets(){   // 위 대상어 칸·계획의 대상어 칸: 추천 3종을 맨 위 '추천' 묶음에 ★로
  const opt=t=>`<option value="${t.id}">${RECO_TG.includes(t.id)?'★ ':''}${t.n} · ${t.m}</option>`;
  const html=(RECO_TG.length?`<optgroup label="${md(TL.date)} 추천">${RECO_TG.map(id=>opt(TARGETS.find(t=>t.id===id))).join('')}</optgroup><optgroup label="전체">`:'')+TARGETS.filter(t=>!RECO_TG.includes(t.id)).map(opt).join('')+(RECO_TG.length?'</optgroup>':'');
  ['#target','#fTarget'].forEach(sel=>{ const el=$(sel); if(el&&el.dataset.h!==html){ el.innerHTML=html; el.dataset.h=html; } if(el) el.value=ST.target; });
}
function renderReco(){
  const el=$('#rcard'); if(!el) return;
  if(!VIEW.reco){ el.innerHTML=''; }
  const d=TL.date, s=trip.point, mo=+d.slice(5,7);
  const list=TARGETS.map(t=>{
    let r=null, at=s;
    if(s) r=score(s,d,t);
    else allSpots().forEach(x=>{ const y=score(x,d,t); if(y&&(!r||y.sc>r.sc)){ r=y; at=x; } });   // 포인트를 안 골랐으면 그날 가장 좋은 항구 기준
    return {t, r, at};
  }).filter(x=>x.r&&!x.r.ban).sort((a,b)=>b.r.sc-a.r.sc);
  const top=list.slice(0,3); RECO_TG=top.map(x=>x.t.id); fillTargets();
  if(!VIEW.reco) return;
  const bans=REGS.filter(x=>inBan(x,d)&&!x.maybe&&!(x.ban[0]==='01-01'&&x.ban[1]==='12-31')).map(x=>x.n);
  el.className='rcard'+(VIEW.recoFold?' folded':'');
  el.innerHTML=`<header id="rHead"><b>${md(d)} 추천 대상어</b><span class="s">${esc(s?s.n:'전국 포인트 중 가장 좋은 곳')} ${VIEW.recoFold?'▾':'▴'}</span></header>
    <div class="rb">${top.length? top.map((x,i)=>{ const b=bestTime(x.at,d,x.t), g=(GEAR[x.t.id]||[]).slice(0,3);
      return `<div class="ritem ${x.t.id===ST.target?'on':''}"><div class="t"><span class="lvtag" style="background:${lvHex(x.r)}">${x.r.lv.n} ${x.r.sc}</span><b>${esc(x.t.n)}</b><span style="color:var(--muted)">${esc(x.t.m)}</span>${x.t.id===ST.target?'':`<button class="btn sm" data-tg="${x.t.id}">이걸로</button>`}</div>
        <div class="ln">${esc(x.r.plus.slice(0,3).join(' · ')||'조건 무난')}${s?'':` · <b>${esc(x.at.n)}</b>`}</div>
        <div class="ln">추천 시간 <b>${timeTxt(b)}</b>${b?` (${esc(b.why.slice(0,2).join('·'))}${b.est?' · 대략':''}) · ${pad((b.s+23)%24)}:30까지 도착`:''}</div>
        <div class="ln">채비 <b>${esc(g.join(', '))}</b></div></div>`; }).join('')
      : '<div class="ln" style="color:var(--muted)">이 날 예보가 아직 없거나 맞는 대상어가 없어요.</div>'}
      <div class="ln" style="color:var(--muted)">${mo}월 제철·예보 수온·물때·바람으로 고른 앱 추정이에요.${bans.length?` 이 날 금어기: <b style="color:var(--bad)">${esc(bans.join(', '))}</b>`:''}</div></div>`;
  $('#rHead').onclick=()=>{ VIEW.recoFold=VIEW.recoFold?0:1; saveView(); renderReco(); };
  el.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{ ST.target=b.dataset.tg; saveState(); $('#target').value=ST.target; redrawAll(); });
}
/* 상단 왼쪽 날짜: 일정 시작일을 바꿈(기간 길이는 유지, 2주 안에서) */
function setStart(d){
  if(!d) return; d=d<TODAY?TODAY:d>LAST?LAST:d;
  trip.start=d; trip.nights=Math.max(0,Math.min(trip.nights,dayDiff(d,LAST))); TL.date=d; ST.date=d; saveTrip(); redrawAll();
}

/* ══════════ 하단 시간 바 (Windy 방식) ══════════
   오늘 ~ 일정 끝. 일정 날짜는 파란 배경, 아래 띠 = 그날 판정 색, 그 위 가는 띠 = 시간별 입질 점수(선택 포인트) */
function tlDays(){ const end=addDays(trip.start,trip.nights), out=[]; for(let d=TODAY; d<=end; d=addDays(d,1)) out.push(d); return out.length>=3? out : [TODAY,addDays(TODAY,1),addDays(TODAY,2)]; }
function buildTimeline(){
  const days=tlDays(), trips=new Set(tripDays()), short=days.length>9, s=trip.point, H=s&&HOURLY.get(hkey(s));
  $('#tlDays').innerHTML=days.map(d=>{ const r=s&&score(s,d); let hb='';
    if(H&&trips.has(d)){ const hs=hourScores(s,d,H,tideCurve(s,d,H)); hb=`<div class="hb">${hs.map(x=>`<i style="background:${LV5HEX[lv5(x.sc).n]}"></i>`).join('')}</div>`; }
    return `<div class="wtl-day ${trips.has(d)?'trip':''} ${d===TODAY?'today':''}"><span class="lb">${d===TODAY?'오늘':short?md(d).replace(/^\d+\//,''):md(d)}</span>${hb}${r?`<div class="lvb" style="background:${lvHex(r)}" title="${r.lv.n} ${r.sc}점"></div>`:''}</div>`; }).join('');
  placeKnob();
}
function placeKnob(){
  const days=tlDays(), i=Math.max(0,days.indexOf(TL.date)), pos=(i*24+TL.hour+0.5)/(days.length*24);
  $('#knob').style.left=(pos*100)+'%'; $('#knobLbl').textContent=`${md(TL.date)} ${pad(TL.hour)}시`;
}
let tlRaf=0;
function setTL(date,hour){
  const changed=date!==TL.date; TL={date,hour}; ST.date=date; placeKnob();
  cancelAnimationFrame(tlRaf);
  clearTimeout(setTL._t);
  if(changed) tlRaf=requestAnimationFrame(()=>{ drawGrid(); if(trip.active==='wx') renderSteps(); updateClick(); renderReco(); });
  else setTL._t=setTimeout(()=>{ if(trip.active==='wx') renderSteps(); updateClick(); },120);   // 끌고 있는 동안 패널을 매번 다시 그리지 않음
}
(function(){
  const tr=$('#track');
  const at=e=>{ const r=tr.getBoundingClientRect(), x=e.clientX-r.left, days=tlDays(), n=days.length*24, k=Math.max(0,Math.min(n-1,Math.floor(x/r.width*n))); setTL(days[Math.floor(k/24)],k%24); };
  let drag=false;
  tr.addEventListener('pointerdown',e=>{ drag=true; tr.setPointerCapture(e.pointerId); at(e); });

function toolGear(opt={}){ const box=opt.el||$('#mb');

  box.querySelector('#gReset').onclick=()=>{ g.done=[]; saveGear(); toolGear({el:box}); };
  box.querySelector('#gRestore').onclick=()=>{ g.removed=[]; saveGear(); toolGear({el:box}); };
}

function planHash(){ const s=trip.point; return '#p='+[trip.start,trip.nights,ST.target,s?s.lat:'',s?s.lon:'',s?encodeURIComponent(s.n):''].join('~'); }
function readShared(){
  const m=location.hash.match(/^#p=(\d{4}-\d\d-\d\d)~(\d+)~([a-z]+)~(-?[\d.]*)~(-?[\d.]*)~(.*)$/); if(!m) return false;
  trip.start=(m[1]>=TODAY&&m[1]<=LAST)?m[1]:TODAY; trip.nights=Math.max(0,Math.min(+m[2],dayDiff(trip.start,LAST)));
  if(TARGETS.some(t=>t.id===m[3])){ ST.target=m[3]; saveState(); }
  if(m[4]&&m[5]){ const lat=+m[4], lon=+m[5], n=decodeURIComponent(m[6]||'')||'공유받은 포인트';
    const base=allSpots().find(x=>haversine(lat,lon,x.lat,x.lon)<0.5);
    trip.point= base? {...base} : {id:'p'+lat+'_'+lon, n, lat, lon, bt:nearestSt(lat,lon).s.bt, temp:true};
    ST.spot=trip.point; trip.done={plan:true,spot:true}; trip.active='wx'; }
  TL.date=trip.start; ST.date=TL.date; saveTrip();
  history.replaceState(null,'',location.pathname+location.search);
  return true;
}
function openShare(){
  const local=['127.0.0.1','localhost'].includes(location.hostname), here=location.href.split('#')[0];
  const rows=[];
  if(LANURL) rows.push(['같은 와이파이','이 맥이 켜져 있고 도우미가 돌 때, 같은 와이파이의 폰·노트북에서',LANURL]);
  if(PUBLIC_URL) rows.push(['인터넷 공개 주소','어디서나 (물때는 추정, 특보는 링크)',PUBLIC_URL]);
  if(!local&&!rows.some(r=>r[2].split('#')[0]===here)) rows.push(['지금 이 주소','',here]);
  $('#mh').innerHTML=`<b>계획 공유</b><button class="btn sm x" id="mx">닫기</button>`;
  $('#mb').innerHTML=`<div class="note" style="margin-top:0">링크를 받은 사람은 같은 일정(${md(trip.start)}${trip.nights?' – '+md(addDays(trip.start,trip.nights)):''})·대상어(${esc(T().n)})·포인트(${esc(trip.point?trip.point.n:'없음')})로 열려요. 각자 기록·즐겨찾기는 각자 기기에만 저장돼요.</div>
    ${rows.length? rows.map((r,i)=>`<h3>${r[0]} <span class="rel">${esc(r[1])}</span></h3><div class="row"><input class="in" id="sh${i}" readonly value="${esc(r[2].split('#')[0]+planHash())}" style="flex:1"><button class="btn pri" data-cp="${i}">링크 복사</button></div>`).join('')
      : `<div class="card">아직 다른 사람이 열 주소가 없어요. '앱 열기'로 도우미를 켜면 같은 와이파이 주소가, 인터넷에 올리면 공개 주소가 여기 나와요.</div>`}
    <h3>계획 요약 (메신저에 붙여넣기)</h3><div class="summary" id="shSum">${esc(tripSummaryText())}</div>
    <div class="btns"><button class="btn" id="cpSum">요약 복사</button></div>
    ${LANURL?'<div class="note">와이파이 주소가 안 열리면 맥의 방화벽이 막은 거예요 — 시스템 설정 → 네트워크 → 방화벽에서 Python 들어오는 연결 허용.</div>':''}`;
  const copy=async(txt,el)=>{ try{ await navigator.clipboard.writeText(txt); toast('복사했어요'); }catch(e){ if(el){ el.select?el.select():0; } toast('복사가 막혔어요 — 직접 선택해 복사하세요'); } };
  $('#mb').querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>{ const el=$('#sh'+b.dataset.cp); copy(el.value,el); });
  $('#cpSum').onclick=()=>copy(tripSummaryText());
  $('#mx').onclick=closeModal; $('#modal').classList.add('open');
}

    <ol style="margin:10px 0 0 18px;padding:0;line-height:1.85">

      <li><b>대상어 고르기</b> — 그 옆 칸. <b>★</b>가 붙은 건 그 날짜에 잘 맞는 추천 어종이에요. 왼쪽 <b>추천 대상어</b> 칸에 이유·채비·추천 시간이 있어요.</li>
      <li><b>지도 보기</b> — 바다 색이 그날 낚시 컨디션: <span style="color:var(--l5)">■</span> 매우좋음 <span style="color:var(--l4)">■</span> 좋음 <span style="color:var(--l3)">■</span> 보통 <span style="color:var(--l2)">■</span> 나쁨 <span style="color:var(--l1)">■</span> 매우나쁨. 점은 항구(포인트), 바다 아무 곳을 눌러도 그 지점 값이 나와요. '위성'으로 갯바위 지형 확인.</li>
      <li><b>포인트 확인</b> — 점을 누르면 오른쪽 <b>낚시 계획</b>에 판정·물때(만조·간조)·입질 좋은 시간·몇 시까지 도착·날씨·금어기가 나와요.</li>
      <li><b>시간 바</b> — 맨 아래 막대를 끌면 날짜·시각이 바뀌고 지도 색도 따라 바뀌어요.</li>
      <li><b>공유</b> — 위 '공유'로 내 계획 링크를 보내면 받은 사람 화면이 같은 계획으로 열려요.</li></ol>
    <div class="note">판정·추천은 예보로 계산한 앱 추정이에요. 출조는 기상청 특보와 현장 상황으로 정하세요. 이 화면은 위 '도구 → 사용법'에서 다시 볼 수 있어요.</div>
    <div class="btns" style="align-items:center"><label style="margin-right:auto;display:flex;gap:6px;align-items:center;font-size:13px;cursor:pointer"><input type="checkbox" id="introNo" ${ls.get('fish.intro',0)?'checked':''} style="width:16px;height:16px"> 다시 보지 않기</label><button class="btn pri" id="introOk">시작하기</button></div>`;
  $('#modal').classList.add('open');
  const done=()=>{ ls.set('fish.intro',$('#introNo').checked?1:0); closeModal(); };
  $('#introOk').onclick=done; $('#mx').onclick=done;
}

/* ══════════ 지도 링크·좌표로 포인트 등록 (다이빙 앱과 같은 해석기) ══════════ */
let URLDRAFT={raw:'',r:null,err:''};
function parseSpotUrl(raw){
  let t=(raw||'').trim(); if(!t) return {err:'URL이나 좌표를 붙여 넣으세요.'};
  try{ t=decodeURIComponent(t.replace(/\+/g,' ')); }catch(e){}
  const ok=(la,lo)=> isFinite(la)&&isFinite(lo)&&Math.abs(la)<=90&&Math.abs(lo)<=180 && !(la===0&&lo===0);
  const out=(la,lo,name,src)=>({lat:+(+la).toFixed(5), lon:+(+lo).toFixed(5), name:(name||'').replace(/[_+]/g,' ').trim(), src});
  let m, name='';
  // 이름 후보
  if(m=t.match(/\/place\/([^\/@?]+)/)) name=m[1];                             // 구글
  else if(m=t.match(/\/link\/(?:map|to)\/([^,\/]+),/)) name=m[1];              // 카카오
  else if(m=t.match(/[?&](?:q|query|name)=([^&@]+)/)) { if(!/^-?\d/.test(m[1])) name=m[1]; }
  else if(m=t.match(/\/search\/([^\/?]+)/)) name=m[1];                         // 네이버 검색
  // 좌표
  if(m=t.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)) return out(m[1],m[2],name,'구글 지도');
  if(m=t.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)) return out(m[1],m[2],name,'구글 지도');
  if(m=t.match(/\/link\/(?:map|to)\/[^,]*,(-?\d+\.\d+),(-?\d+\.\d+)/)) return out(m[1],m[2],name,'카카오맵');
  if(m=t.match(/[?&]mlat=(-?\d+\.\d+)&mlon=(-?\d+\.\d+)/)) return out(m[1],m[2],name,'OpenStreetMap');
  if(m=t.match(/#map=\d+\/(-?\d+\.\d+)\/(-?\d+\.\d+)/)) return out(m[1],m[2],name,'OpenStreetMap');
  { const la=t.match(/[?&](?:lat|y)=(-?\d+\.\d+)/), lo=t.match(/[?&](?:lng|lon|x)=(-?\d+\.\d+)/); if(la&&lo&&ok(+la[1],+lo[1])) return out(la[1],lo[1],name,'지도 링크'); }
  if(m=t.match(/[?&](?:q|ll|query|sll|center|daddr|destination)=(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/)) return out(m[1],m[2],name,'지도 링크');
  if(m=t.match(/[?&]c=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/)){                     // 네이버 c=
    const a=+m[1], b=+m[2];
    if(Math.abs(a)>1000){ const lo=a/20037508.34*180, la=Math.atan(Math.exp(b/20037508.34*Math.PI))*360/Math.PI-90; if(ok(la,lo)) return out(la,lo,name,'네이버 지도'); }   // 웹 메르카토르(미터)
    else if(ok(b,a)&&a>90) return out(b,a,name,'네이버 지도');                     // 경도,위도
  }
  if(m=t.match(/^geo:(-?\d+\.\d+),(-?\d+\.\d+)/i)) return out(m[1],m[2],name,'geo');
  // 도분초: 33°14'24"N 126°33'36"E
  const dms=[...t.matchAll(/(\d+)[°º]\s*(\d+)?['′]?\s*(\d+(?:\.\d+)?)?["″]?\s*([NSEW북남동서])/gi)];
  if(dms.length>=2){ const v=x=>{ const d=+x[1]+(+x[2]||0)/60+(+x[3]||0)/3600; return /[SW남서]/i.test(x[4])?-d:d; }; const a=dms.find(x=>/[NS북남]/i.test(x[4])), b=dms.find(x=>/[EW동서]/i.test(x[4])); if(a&&b) return out(v(a),v(b),name,'좌표'); }
  if(m=t.match(/(-?\d{1,3}\.\d{3,})\s*[, ]\s*(-?\d{1,3}\.\d{3,})/)){ let la=+m[1], lo=+m[2]; if(Math.abs(la)>90) [la,lo]=[lo,la]; if(ok(la,lo)) return out(la,lo,name,'좌표'); }   // "경도, 위도" 순서도 받아 줌
  if(/naver\.me|goo\.gl|maps\.app|kko\.to|place\.map\.kakao\.com|m\.place\.naver|naver\.com\/p\/entry/i.test(t))
    return {err:'이 링크는 주소 안에 좌표가 없어(짧은 공유 링크·장소 번호 링크) 앱이 직접 읽을 수 없어요. 지도에서 그 장소를 연 뒤 주소창의 긴 주소를 붙이거나, 좌표를 복사해 붙여 주세요. 또는 Claude에게 이 링크를 보내면 분석해서 등록해 드려요.'};
  return {err:'링크에서 좌표를 찾지 못했어요. 구글·네이버·카카오 지도의 긴 주소나 "33.24, 126.56" 같은 좌표를 붙여 주세요.'};
}
function regionLabel(lat,lon){ const n=nearestSt(lat,lon); return n.km<60? `${n.s.n} 근처 (${n.km.toFixed(0)}km)` : `가장 가까운 물때 지점 ${n.s.n} ${n.km.toFixed(0)}km`; }

try{ ['fish.grid','fish.gridsea','fish.land.v1','fish.land.v2','fish.state.old'].forEach(k=>localStorage.removeItem(k)); }catch(e){}   // 예전 판 저장분 정리

setBase(VIEW.base==='sat'?'sat':'dark');
const SHARED=readShared();
$('#target').value=ST.target;
(async function init(){
  applyView(); renderSteps(); buildTimeline(); renderLegend(); renderHint();

  renderHint();
  await loadPubWx();
  await loadDaily(); drawMarkers(); renderSteps(); buildTimeline(); renderReco(); loadFidx();
  Promise.all([loadGrid(),loadLand()]).then(drawGrid);   // 바다 색은 포인트 다음에(요청이 몰리지 않게)
  if(trip.point){ map.setView([trip.point.lat,trip.point.lon],Math.max(map.getMinZoom(),8)); loadPoint(); }
  if(!SHARED) showIntro();
})();
</script>
