name: 바다낚시지수 갱신
on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 (한국 시각)
    - cron: '30 8 * * *'    # 매일 17:30 (한국 시각)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_fish_index.py
        env:
          DATAGO_KEY: ${{ secrets.DATAGO_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/fish-index.json
          git diff --cached --quiet || (git commit -m "바다낚시지수 갱신" && git push)
